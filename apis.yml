aid: smile-identity
name: Smile Identity
description: >-
  Smile Identity (Smile ID) is Africa's leading digital identity verification,
  fraud detection, AML and KYC/KYB compliance platform. Its V3 REST API and v12
  mobile/web SDKs let businesses onboard and authenticate users across all 54
  African countries and beyond, covering thousands of ID types and documents.
  Products include Biometric KYC, Document Verification, Enhanced Document
  Verification, Basic and Enhanced KYC, Business Verification (KYB), SmartSelfie
  registration/authentication/compare, phone and address verification, and
  AML monitoring. Verifications run against government and institutional data
  sources, with passive/active liveness, and results delivered synchronously
  and via asynchronous callback webhooks.
